<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="index4.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo-List</title>

    <script src="index4.js"></script>
  </head>
  <body>
    <div class="container" id="body-container">
      <h1 id="colored-title">ToDo List</h1>
      <div class="field" id="task-field">
        <label for="input-field">Enter the task:
        <input type="text" id="input-field" />
      </div>
      <div class="taskbody" id="task-body">
        <p id="message"></p>
        <ul class="tasklist" id="task-list"></ul>
        <button class="submitbtn" id="submit-btn">Add Task</button>
      </div>
    </div>
  </body>
</html>
